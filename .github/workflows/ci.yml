name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (syntax check and unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check src/decoder.js
          node --check src/app.js
          node --check test/decoder.test.js
          node --check tools/ut-csv-reporter.js
          node --check tools/review-check.js
          node --check tools/stage-gate.js
          node --check tools/lint.js

      - name: Lint (conventions, purity, encoding, links, secrets)
        run: npm run lint

      - name: Review checks (requirements, SWDD, UT design, tests, code)
        run: npm run review

      - name: Verify frozen stages
        run: npm run gate

      - name: Run unit tests
        run: npm test

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ut-report
          path: reports/ut-report.csv
          if-no-files-found: warn
